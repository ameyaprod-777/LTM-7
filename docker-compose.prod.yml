# Production OVH — PostgreSQL + app Next.js
# Usage : docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build

services:
  db:
    image: postgres:16-alpine
    container_name: louetonmatos-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - louetonmatos_pgdata:/var/lib/postgresql/data
    networks:
      - internal
  # Pas de ports: exposés — PostgreSQL accessible uniquement par le conteneur app
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 1G

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: louetonmatos-app
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      NODE_ENV: production
    ports:
      # Écoute uniquement en local — Nginx sur l'hôte fait le HTTPS public
      - "127.0.0.1:3000:3000"
    volumes:
      - louetonmatos_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 2G

networks:
  internal:
    driver: bridge

volumes:
  louetonmatos_pgdata:
  louetonmatos_uploads:

# Alternative HTTPS : ajouter un service Caddy ou Traefik devant app
# et retirer le binding 127.0.0.1 si le proxy est dans ce même compose.
